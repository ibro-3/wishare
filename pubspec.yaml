name: wishare
description: "LAN-only peer-to-peer file and folder sharing for Linux, Android and Windows"
publish_to: "none"
version: 0.3.0+6

environment:
  sdk: ">=3.14.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9

  # State + routing
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4

  # Material 3 / platform
  material_ui: ^1.11.1
  dynamic_color: ^2.1.0
  material_color_utilities: ^0.13.0
  window_manager: ^0.7.1
  windows_single_instance: ^1.2.0
  tray_manager: ^0.9.1
  flutter_local_notifications: ^23.0.4
  flutter_foreground_task: ^11.0.3
  receive_sharing_intent: ^1.9.0

  # Discovery, pairing, transport
  multicast_dns: ^0.3.3+1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0
  pointycastle: ^4.0.0
  crypto: ^3.0.8

  # Storage / files
  path: ^1.9.1
  path_provider: ^2.1.6
  file_picker: ^13.4.1
  shared_preferences: ^2.5.6

  # Updates (GitHub Releases)
  http: ^1.6.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/icons/tray_icon.png
