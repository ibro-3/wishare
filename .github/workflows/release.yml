name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (for example v0.1.0)'
        required: true
        default: 'v0.1.0'

env:
  VERSION: 0.1.0
  FLUTTER_VERSION: 3.50.1

jobs:
  windows:
    name: Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package Windows build
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build/windows -Recurse -Filter wishare.exe |
            Select-Object -First 1
          if (-not $exe) { throw "wishare.exe was not produced" }
          $source = $exe.DirectoryName
          $archive = "wishare-$env:VERSION-windows-x64.zip"
          Compress-Archive -Path "$source\*" -DestinationPath $archive -Force
          Get-Item $archive | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: wishare-*.zip
          if-no-files-found: error

  linux:
    name: Linux zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libunwind-dev zip
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package Linux bundle
        run: |
          cd build/linux/x64/release
          zip -r "$GITHUB_WORKSPACE/wishare-$VERSION-linux-x64.zip" bundle
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: wishare-*.zip
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Generate CI signing keystore
        run: |
          keytool -genkeypair -keystore wishare-ci.jks \
            -storepass wishare123 -keypass wishare123 \
            -alias wishare -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Wishare CI, OU=Wishare, O=Wishare, L=NA, ST=NA, C=US"
      - name: Build release APK
        run: flutter build apk --release
        env:
          WISHARE_KEYSTORE_PATH: ${{ github.workspace }}/wishare-ci.jks
          WISHARE_STORE_PASSWORD: wishare123
          WISHARE_KEY_ALIAS: wishare
          WISHARE_KEY_PASSWORD: wishare123
      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            "wishare-$VERSION-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: wishare-*.apk
          if-no-files-found: error

  release:
    name: Publish release
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Create GitHub release with assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Wishare v${{ env.VERSION }}
          generate_release_notes: true
          files: dist/*
